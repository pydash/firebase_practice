<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lost and Found</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="">
      <h1>Lost and Found</h1>
    </div>
    <div class="row">
      <div
        class="box col-12 col-sm-6 d-flex flex-column justify-content-center align-items-center"
      >
        <h2 class="fs-1">Add Item</h2>
        <div class="field">
          <label for="add-item">Item Name</label>
          <input
            class="field-input"
            type="text"
            id="add-item"
            placeholder="Enter item name"
          />
        </div>

        <div class="field">
          <label for="category">Category</label>
          <input
            class="field-input"
            type="text"
            id="category"
            placeholder="Enter category"
          />
        </div>

        <div class="field">
          <label for="brand">Brand</label>
          <input
            class="field-input"
            type="text"
            id="brand"
            placeholder="Enter brand"
          />
        </div>
        <div class="field">
          <label for="description">Description</label>
          <input
            class="field-input"
            type="text"
            id="description"
            placeholder="Enter description"
          />
        </div>
        <button class="button" id="add-item-button">Add Item</button>
      </div>

      <div
        class="box col-12 col-sm-6 d-flex flex-column justify-content-center align-items-center"
      >
        <h2 class="search-heading fs-1">Search Item</h2>
        <div class="field">
          <label for="search">Search Bar</label>
          <input
            class="field-input"
            type="text"
            id="search"
            placeholder="Enter lost item category"
          />
        </div>
        <button class="button" id="search-button">Search</button>

        <ul id="items-list"></ul>
      </div>
    </div>

    <script type="module" src="./index.js"></script>
  </body>
</html>
